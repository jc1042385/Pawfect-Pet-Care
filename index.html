<!DOCTYPE html>
<html lang="en">

<head>
    <!-- James D. Christenson -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
        crossorigin="anonymous"></script>
    <title>Pawfect Pet Care</title>
</head>

<body>
    <nav id="top">
        <a href="#top">Top</a>
        <a href="#gallary">Gallery</a>
        <a href="#services">Services</a>
        <a href="#faq">FAQ</a>
    </nav>

    <main>
        <div id="gallery">
            <div id="carouselExampleCaptions" class="carousel slide">
                <div class="carousel-indicators">
                    <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="0" class="active"
                        aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="1"
                        aria-label="Slide 2"></button>
                    <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="2"
                        aria-label="Slide 3"></button>
                </div>
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img src="images/images1.jpeg" class="d-block w-100" alt="">
                        <div class="carousel-caption d-none d-md-block">
                            <h5>Cat</h5>
                            <p>Funny name for a dog, but is super happy after our services</p>
                        </div>
                    </div>
                    <div class="carousel-item">
                        <img src="images/images2.jpeg" class="d-block w-100" alt="">
                        <div class="carousel-caption d-none d-md-block">
                            <h5>The Bloopinator</h5>
                            <p>Another ridiculous name. Loved the attention though.</p>
                        </div>
                    </div>
                    <div class="carousel-item">
                        <img src="images/images3.jpeg" class="d-block w-100" alt="Small dog with ">
                        <div class="carousel-caption d-none d-md-block">
                            <h5>Mr. Chaos</h5>
                            <p>He is choas incarnate, loved the belly rubs afterwards though.</p>
                        </div>
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleCaptions"
                    data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleCaptions"
                    data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </div>

        <div id="services">

        </div>

        <div id="faq">

        </div>
    </main>
</body>

</html>
